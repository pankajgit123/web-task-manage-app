@if (isAddNewTask) {
    <app-add-task [userId]="userId" (cancel)="onCancelTask()" />
}
<!-- <app-test></app-test> -->

<section id="tasks">
    <header>
        <h2>
            {{name}}'s Tasks'
        </h2>
        <menu>
            <button (click)="addTask()">Add Task</button>
        </menu>
    </header>

    <ul>
        @for (task of selectedUserTasks(); track task.id) {
            <li>
                <app-task [task]="task" />
            </li>
        }
    </ul>
</section>
